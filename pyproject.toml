[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-connectors"
version = "0.1.0"
description = "Headless website MCP connectors hosted on Windows 11"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.2.0",
    "playwright==1.63.0",
]

[project.scripts]
mcp-connectors = "mcp_connectors.server:main"

[tool.setuptools.packages.find]
where = ["src"]
