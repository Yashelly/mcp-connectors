[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-connectors"
version = "0.1.0"
description = "Website MCP connectors with visible Chromium sessions on Windows 11"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.2.0",
    "playwright==1.63.0",
    "beautifulsoup4==4.14.3",
    "pydantic==2.13.5",
]

[project.scripts]
mcp-connectors = "mcp_connectors.server:main"

[tool.setuptools.packages.find]
where = ["src"]
